# 把各模块已发布的版本同步进 data/changelog/*.yaml（/whatsnew/ 更新日志页），有变化就提交并重新部署 Pages。
# 逻辑在 scripts/sync-changelog.py：upcoming 条目在版本发布后改成 released 并改成真实发布日期；
# 文件里还没有的新版本按提交生成条目（带 generated: true，可事后人工润色）。
#
# 触发方式：
#   - schedule：每 15 分钟轮询各模块的发布情况（扩展与 npm 包的发版流水线都会打版本标签）
#   - workflow_run：build-apps.yml 跑完（可能刚发布了 mac / android 安装包）后立即跑一次
#   - repository_dispatch(module-released)：其他仓库发版后可以主动通知，不必等轮询
#   - workflow_dispatch：手动触发
#
# 需要的 secrets：
#   APP_SOURCE_TOKEN              已有，读取 dsh-macapp / dsh-androidapp 的提交
#   CHROME_EXTENSION_DEPLOY_KEY   dsh-chrome-extension 的只读 deploy key（SSH 私钥）
#   DEEPSEEK_API_KEY              可选；配置后由模型把提交改写成面向用户的中英文案，否则用提交标题
name: Sync changelog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["Build & publish app installers"]
    types: [completed]
  repository_dispatch:
    types: [module-released]
  workflow_dispatch:

permissions:
  contents: write   # 提交 data/changelog
  actions: write    # 触发 pages.yml

concurrency:
  group: changelog-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync released versions
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SOURCE_TOKEN: ${{ secrets.APP_SOURCE_TOKEN }}
          CHROME_EXTENSION_DEPLOY_KEY: ${{ secrets.CHROME_EXTENSION_DEPLOY_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/sync-changelog.py

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/changelog; then
            echo "更新日志已是最新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/changelog
          git commit -m "whatsnew: 同步已发布版本"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          # GITHUB_TOKEN 的 push 不会触发 pages.yml，这里显式触发重新部署
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main
