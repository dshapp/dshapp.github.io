# 每次 push 到 main 自动构建 Hugo 站点并发布到 GitHub Pages（https://dshapp.github.io/）
name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 也可在 Actions 页面手动触发重新部署；build-apps.yml 发布新安装包后也走这里
  release:
    types: [published]      # 手动在网页上发布 Release 时同样刷新下载页

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署；新的 push 进来时排队，不中断正在发布的版本
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.166.0
      HUGO_ENVIRONMENT: production
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo (extended)
        run: |
          wget -q -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch latest app installers
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/fetch-releases.py

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Sanity check
        run: |
          test -f public/index.html
          test -f public/en/index.html
          test -f public/404.html
          echo "### Build OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- html pages: $(find public -name '*.html' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- size: $(du -sh public | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- installers:" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "  - \(.key): \(.value.version) (\(.value.file))"' data/releases.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
