{{- /* sections/feature-cu.html —— dict: h */ -}}
{{- $h := .h -}}
{{- $c := $h.cu -}}
<section class="feature container-wide" id="cu">
  <div class="split reverse">
    <div class="feature__copy reveal">
      <p class="eyebrow">{{ $c.eyebrow }}</p>
      <h2 class="display-2">{{ $c.title }}</h2>
      <p class="body-large text-tertiary">{{ $c.body }}</p>
      <ul class="feature__list">
        {{- range $c.bullets }}<li><span>{{ . | safeHTML }}</span></li>{{ end }}
      </ul>
    </div>

    <div class="split-media stack stack-16 reveal">
      <figure class="shot-frame grain">
        {{ partial "shot-img.html" (dict "src" $c.shot "alt" $c.shotAlt) }}
      </figure>
      <div class="feature__more feature__more--tight">
        <p class="micro text-quaternary">{{ $c.toolsNote }}</p>
        <a class="btn btn--secondary btn--sm" href="{{ "docs/computer-use/" | relLangURL }}">
          {{ i18n "docs.title" }}{{ partial "icon.html" "arrow-right" }}
        </a>
      </div>
    </div>
  </div>
</section>
