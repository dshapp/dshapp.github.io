{{- /* 站内以 / 开头的链接补上 baseURL 子路径（部署在子路径下时也能正确解析） */ -}}
{{- $href := .Destination -}}
{{- if strings.HasPrefix $href "/" -}}{{- $href = strings.TrimPrefix "/" $href | relURL -}}{{- end -}}
<a href="{{ $href | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
{{- /* */ -}}
