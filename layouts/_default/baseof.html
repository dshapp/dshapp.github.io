<!doctype html>
{{- /* 站点固定深色：data-theme=dark，与 linear.app 一致 */ -}}
<html lang="{{ site.Language.Lang }}" data-theme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body class="no-js">
  <a class="skip-link" href="#main">{{ i18n "a11y.skip" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
