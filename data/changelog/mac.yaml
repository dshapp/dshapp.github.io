# macOS App 更新日志 —— 由 git 历史整理，供 /whatsnew/ 页面使用
entries:
  - version: "0.1.73"
    date: "2026-10-20"
    status: released
    generated: true  # 由 scripts/sync-changelog.py 自动生成，人工润色后删掉这一行
    title:
      zh: "新功能与问题修复"
      en: "New features and fixes"
    changes:
      - type: new
        zh: "思考卡片思考中摘要按 Web 规则随段落前进（取最新一段已写完的首行），超长时右侧渐隐不显示省略号；思考结束显示首行，摘要去掉 ** 标记。"
      - type: new
        zh: "引导弹窗说明中的“DeepSeek 官方模型”改为原生 Link，点击在浏览器打开 DeepSeek 平台 API Key 申请页。"
      - type: new
        zh: "移动端访问、浏览器、电脑操作页缺依赖插件时一键安装：统一走 pluginManager 安装并启用，需重启时自动重启服务；浏览器页 Chrome 扩展未装时按钮直接在 Chrome 打开商店安装页；移除不再使用的 DshPluginRunner。"
      - type: new
        zh: "DSH Server 页新版本标题改为跳转 GitHub 发布日志的链接；更新按钮加加载动画；底部说明退出 App 后服务仍在后台运行。"
      - type: fixed
        zh: "输入法上屏途中嵌套 run loop 里 SwiftUI 刷新时跳过输入框同步，避免改字中途改文本/强制排版抛异常穿过视图更新，修复中文输入切换中英文后 Observation 访问野指针崩溃。"
      - type: fixed
        zh: "聊天记录面板宽度改由 GeometryReader 同步读取，图片加载占位使用最终缩略图尺寸，修复切换会话后最后一段消息偶发被裁切。"
  - version: "0.1.72"
    date: "2026-10-15"
    status: released
    title:
      zh: 聊天记录排版更齐整，修复偶发崩溃
      en: Tidier transcript layout and a crash fix
    changes:
      - type: improved
        zh: 聊天记录与输入框使用同一列宽并左右对齐，轮次导航条贴近滚动条。
        en: The transcript and composer now share one column width and align on both sides, and the turn rail sits next to the scroll bar.
      - type: fixed
        zh: 修复滚动到底部时，轮次末尾的改动文件卡片偶尔被裁掉一截。
        en: Fixed the changed-files card at the end of a turn occasionally being clipped when scrolled to the bottom.
      - type: fixed
        zh: 修复运行状态行在长会话中可能引发的崩溃。
        en: Fixed a crash the running-status line could trigger in long sessions.
  - version: "0.1.71"
    date: "2026-10-15"
    status: released
    title:
      zh: 自动化任务、插件页与应用内更新
      en: Automations, a plugins page and in-app updates
    changes:
      - type: new
        zh: 侧栏新增「自动化任务」，可查看和管理定时任务；新建时会打开新会话并预填好提示，说一句就能创建。
        en: A new “Automations” entry in the sidebar lists and manages scheduled tasks; creating one opens a new session with a ready-made prompt.
      - type: new
        zh: 侧栏恢复「插件」入口，插件管理页与 Web 端一致，官方插件可直接查看说明、安装和更新。
        en: The “Plugins” entry is back in the sidebar with a management page matching the web UI, where official plugins can be read about, installed and updated.
      - type: new
        zh: 发现新版本时 App 会在后台下载，并展示这一版的更新内容，确认后一键安装重启。
        en: New versions now download in the background, show their release notes, and install with a single restart.
      - type: new
        zh: 运行中的会话底部会显示当前在做的动作和已用时间。
        en: Running sessions show the current action and elapsed time at the bottom.
      - type: improved
        zh: 模型设置页和 Agent 预设页按 Web 端重做；设置移到侧栏最底部，已归档会话改用筛选查看。
        en: The model settings and agent preset pages were rebuilt to match the web UI; Settings moved to the bottom of the sidebar and archived sessions are now a filter.
      - type: improved
        zh: 粘贴复制的文件或文件夹与拖入效果一致，会作为附件加入，不再只粘贴文件名；发送的文件会在消息上方显示文件卡片。
        en: Pasting copied files or folders now works like dragging them in, adding attachments instead of file names, and sent files appear as cards above your message.
      - type: improved
        zh: 适配 DSH 0.2.1，工作树改用 DSH 官方能力，终端、分支与「打开 Workspace」跟随当前工作目录。
        en: Updated for DSH 0.2.1, using DSH's own worktrees, with the terminal, branch menu and “Open Workspace” following the current working directory.
      - type: fixed
        zh: 修复更新 dsh 后重启服务会被降级回旧版本；安装与更新 dsh 时固定使用官方 npm 源，避免镜像未同步导致失败。
        en: Fixed restarting the service after updating dsh rolling it back to an older version, and installs and updates now use the official npm registry so lagging mirrors no longer break them.
      - type: fixed
        zh: 修复子代理与后台任务弹层高度塌缩、Markdown 链接点击后失效和列表排版时的偶发崩溃。
        en: Fixed collapsed subagent and background-task popovers, links in Markdown going dead after a click, and an occasional crash while laying out lists.
  - version: "0.1.69"
    date: "2026-10-10"
    status: released
    title:
      zh: 直接检出远程分支
      en: Check out remote branches directly
    changes:
      - type: new
        zh: 分支菜单会列出只存在于远程的分支，可以搜索并直接检出。
        en: The branch menu now lists branches that exist only on the remote, with search and one-click checkout.
  - version: "0.1.68"
    date: "2026-10-02"
    status: released
    title:
      zh: 适配 DSH 0.2，限时提问与可搜索的模型菜单
      en: DSH 0.2 support, timed questions and a searchable model menu
    changes:
      - type: new
        zh: 支持带倒计时的提问：超时后 Agent 会先继续，你仍可以稍后作答，回答会显示在对话里。
        en: Questions can now carry a countdown; if time runs out the agent carries on, and you can still answer later with the reply shown in the conversation.
      - type: improved
        zh: 模型菜单超过 4 个模型时可以搜索，按名称排序并隐藏空分组。
        en: The model menu becomes searchable once it holds more than four models, sorted by name with empty groups hidden.
      - type: improved
        zh: 定时触发的轮次显示为「自动化任务」卡片；会话搜索按原始标题匹配，无标题的会话显示「未命名」。
        en: Turns started by a schedule show as “Automation” cards, and session search matches original titles, with untitled sessions shown as “Untitled”.
  - version: "0.1.67"
    date: "2026-09-28"
    status: released
    title:
      zh: 会话搜索与 Web 端一致
      en: Session search matches the web UI
    changes:
      - type: improved
        zh: 会话搜索结果的匹配与排序和 Web 端保持一致。
        en: Session search now matches and ranks results the same way as the web UI.
  - version: "0.1.66"
    date: "2026-09-25"
    status: released
    title:
      zh: 模型设置跟进最新供应商目录
      en: Model settings follow the latest provider catalog
    changes:
      - type: improved
        zh: 模型设置页使用与 Web 端一致的供应商目录，并支持 DeepSeek 账号路由。
        en: Model settings now use the same provider catalog as the web UI, including DeepSeek account routing.
      - type: fixed
        zh: 修复 Agent 预设页显示「数据缺失」的问题。
        en: Fixed the agent presets page showing a “missing data” error.
  - version: "0.1.65"
    date: "2026-09-24"
    status: released
    title:
      zh: 后台任务管理与更稳的流式输出
      en: Background task controls and steadier streaming
    changes:
      - type: new
        zh: 后台任务可以停止（需二次确认），详情实时显示输出；列表分为进行中与已结束，已结束的可折叠和清空。
        en: Background tasks can be stopped (with confirmation) and show live output; the list splits running and finished tasks, and finished ones can be collapsed or cleared.
      - type: new
        zh: 安装插件时可选择下载源，并自动选用最快的源。
        en: Installing a plugin lets you pick a download source and automatically uses the fastest one.
      - type: improved
        zh: 对话中隐藏系统提示词和普通的上下文注入；由通知唤醒的轮次显示为一行提示。第一次发送消息时会自动创建默认工作区。
        en: System prompts and routine context injections are hidden, turns woken by notifications show as a single line, and a default workspace is created on your first message.
      - type: fixed
        zh: 修复流式回复时聊天记录上下抖动，以及轮次末尾改动卡片偶尔被裁切。
        en: Fixed the transcript jittering during streaming replies and the end-of-turn changes card occasionally being clipped.
  - version: "0.1.64"
    date: "2026-09-23"
    status: released
    title:
      zh: 置顶会话、变更文件卡片与新设置页
      en: Pinned sessions, changed-file cards and new settings
    changes:
      - type: new
        zh: 右键会话即可置顶，置顶的会话集中显示在侧栏最上方的「已置顶」分区。
        en: Right-click a session to pin it; pinned sessions gather in a “Pinned” section at the top of the sidebar.
      - type: new
        zh: 每轮对话结束后新增变更文件卡片，列出改动的文件与增删行数，点开即可查看逐文件差异。
        en: Each turn now ends with a changed-files card listing edited files with added/removed lines, and opens a per-file diff on click.
      - type: new
        zh: 设置新增「浏览器」分页，检测 Chrome 插件与扩展、一键安装并显示连接状态和具体失败原因。
        en: A new “Browser” settings tab detects the Chrome plugin and extension, installs them in one click and shows connection status with specific failure reasons.
      - type: new
        zh: 设置新增「电脑操作」分页，可一键安装电脑操作插件、查看辅助功能与屏幕录制授权，并直达系统设置授权页。
        en: A new “Computer use” settings tab installs the computer-use plugin in one click, shows Accessibility and Screen Recording permissions, and jumps straight to System Settings.
      - type: new
        zh: 插件移入设置，可在「插件市场」与「内置插件」间切换，并直接启用、停用或移除插件组合包。
        en: Plugins now live in Settings with a “Marketplace” / “Built-in” switch, and plugin bundles can be enabled, disabled or removed in place.
      - type: new
        zh: 侧栏「移动端访问」会在浏览器中打开手机配对与设备管理页，扫码即可让手机连上这台 Mac。
        en: “Mobile access” in the sidebar opens the phone pairing and device management page in your browser, so a phone can connect to this Mac by scanning a QR code.
      - type: new
        zh: 聊天记录左侧新增轮次导航条，可按轮次跳转并翻入更早的历史，查找也补齐了「下一个／上一个」快捷键。
        en: A turn rail beside the transcript lets you jump between turns and page into earlier history, and find now has “Next” / “Previous” shortcuts.
      - type: new
        zh: 输入框新增回形针按钮添加附件，工作区外的文件也会真正上传；底部新增会话统计与 token 用量弹窗。
        en: A paperclip button in the composer adds attachments, uploading files from outside the workspace, and new popovers show session stats and token usage.
      - type: new
        zh: 自己发出的消息里，网址、文件路径和会话引用都可点击跳转，圈选的网页元素会显示为易读的键值卡片。
        en: URLs, file paths and session references in your own messages are now clickable, and picked page elements show as readable key-value cards.
      - type: improved
        zh: 上下文中的图片可用系统快速查看打开，交付卡片可「打开」或「在 Finder 中显示」，已归档会话也能在设置中恢复。
        en: Images in context open in Quick Look, deliverable cards offer “Open” and “Show in Finder”, and archived sessions can be restored from Settings.
      - type: improved
        zh: 聊天记录回归原生滚动，流式输出和多行输入时不再上下跳动；同时适配新版 DSH，并直接使用终端里的 node 与 npm。
        en: The transcript is back to native scrolling with no more jumping while replies stream or you type multiple lines, and the app supports newer DSH releases using the node and npm from your terminal.
      - type: fixed
        zh: 修复侧栏与输入框的多处崩溃，以及浅色模式弹窗发灰、历史会话模型显示错误、点击相对路径文件链接报错等问题。
        en: Fixed several sidebar and composer crashes, greyed-out popovers in light mode, wrong models on past sessions, and errors when clicking relative file links.

  - version: "0.1.63"
    date: "2026-09-07"
    status: released
    title:
      zh: 一键打开 Web 端
      en: Open the web app in one step
    changes:
      - type: new
        zh: 应用菜单新增「打开 Web 端」，按 ⇧⌘, 即可在浏览器中打开已登录的 Web 界面。
        en: A new “Open Web App” menu item (⇧⌘,) opens the signed-in web interface in your browser.
      - type: improved
        zh: 计划卡片的修订备注输入框会随内容自动增高，最多显示五行。
        en: The revision note box on plan cards now grows with your text, up to five lines.
      - type: improved
        zh: 提问卡片的标题和审批卡片的说明文字可以选中复制了。
        en: Question card titles and approval card reasons can now be selected and copied.
      - type: fixed
        zh: 设置中的服务地址会带上一次性登录凭据，点开不再是未授权的空白页。
        en: The server address in Settings now includes a one-time sign-in, so opening it no longer lands on an unauthorized page.
      - type: fixed
        zh: 发送消息时自动去掉首尾空行和空格，纯空白的草稿不再被发出。
        en: Leading and trailing blank lines and spaces are now trimmed when sending, and whitespace-only drafts are no longer sent.

  - version: "0.1.59"
    date: "2026-09-07"
    status: released
    title:
      zh: 显示 Chrome 扩展连接状态
      en: Chrome extension status in Settings
    changes:
      - type: new
        zh: 设置的服务页会显示 Chrome 扩展是否已连接、未连接或桥接未运行，并每隔几秒自动刷新。
        en: The server page in Settings now shows whether the Chrome extension is connected, disconnected or its bridge is down, refreshing every few seconds.

  - version: "0.1.58"
    date: "2026-09-07"
    status: released
    title:
      zh: 侧栏更稳定，新建会话不再卡住
      en: Steadier sidebar and reliable new sessions
    changes:
      - type: fixed
        zh: 修复在侧栏搜索、折叠分组或按住 ⌘ 时可能导致应用崩溃的问题。
        en: Fixed a crash that could occur while searching the sidebar, collapsing groups or holding ⌘.
      - type: fixed
        zh: 新建会话不再复用已无法打开的空白会话，首条消息可以正常发出。
        en: New sessions no longer reuse a blank session that can’t be opened, so your first message sends normally.
      - type: fixed
        zh: 会话连接失败时会显示错误提示，而不是一直停在“执行中”。
        en: When a session fails to connect, an error is now shown instead of it staying stuck as running.

  - version: "0.1.55"
    date: "2026-09-07"
    status: released
    title:
      zh: 发送消息时队列不再闪烁
      en: No more queue flicker when sending
    changes:
      - type: fixed
        zh: 在空闲会话中发送消息时，底部的排队栏不再一闪而过。
        en: Sending a message to an idle session no longer briefly flashes the queue bar.

  - version: "0.1.54"
    date: "2026-09-07"
    status: released
    title:
      zh: Dock 角标计数更准确
      en: Accurate Dock badge count
    changes:
      - type: fixed
        zh: 启动时会重新核对 Dock 角标，上次运行残留的未读计数会被清除。
        en: The Dock badge is now reconciled at launch, clearing leftover unread counts from the previous run.

  - version: "0.1.53"
    date: "2026-09-07"
    status: released
    title:
      zh: 回合过程折叠更干净
      en: Cleaner folding of turn details
    changes:
      - type: improved
        zh: 已结束回合折叠后，智能体指令、技能列表等上下文注入也一并收进摘要，聊天记录只留下回答。
        en: When a finished turn is folded, context injections such as agent instructions and the skill list are tucked into the summary too, leaving just the answer.
