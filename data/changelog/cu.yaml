# dsh-kimi-computer-use 电脑操控 更新日志 —— 由 git 历史整理，供 /whatsnew/ 页面使用
entries:
  - version: "0.1.3"
    date: "2026-08-30"
    status: released
    title:
      zh: 首个版本：后台操作 Mac 应用
      en: "First release: operate Mac apps in the background"
    changes:
      - type: new
        zh: 接入 Kimi Computer Use 后，agent 可以在后台查看并操作 macOS 应用：点击、输入、按键、滚动、拖拽、选中文字和截图，不占用你的鼠标。
        en: With Kimi Computer Use connected, the agent can inspect and operate macOS apps in the background — click, type, press keys, scroll, drag, select text and take screenshots — without taking over your mouse.
      - type: new
        zh: 内置操作技能，agent 每一步操作前后都会重新读取界面状态并核对结果，减少点错位置。
        en: A built-in skill has the agent re-read the app’s state before and after every step and verify the result, cutting down on misclicks.
      - type: new
        zh: 发送、删除、购买、发布等难以撤回的操作，agent 会先说明将要发生什么并征得你的确认。
        en: Before sending, deleting, purchasing, publishing or any other hard-to-undo action, the agent explains what will happen and asks for your confirmation.
      - type: improved
        zh: 工具不可用时，agent 会提示你检查 KimiCU 应用是否已安装并在运行。
        en: If the tools are unavailable, the agent tells you to check that the KimiCU app is installed and running.
