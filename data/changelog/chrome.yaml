    date: "2026-10-20"
    status: released
    generated: true  # 由 scripts/sync-changelog.py 自动生成，人工润色后删掉这一行
    title:
      zh: "新功能与改进"
      en: "New features"
    changes:
      - type: new
        zh: "输入框文件胶囊可点击打开（文件用默认应用、文件夹在访达打开），复制胶囊写入完整 @path，粘贴符合文件引用写法的纯文本自动还原为胶囊；修复气泡里相对路径的文件胶囊未按会话目录解析导致打不开。"
  - version: "0.3.16"
    date: "2026-10-20"
    status: released
    generated: true  # 由 scripts/sync-changelog.py 自动生成，人工润色后删掉这一行
    title:
      zh: "用户发送与 Agent 回复里的图片点击放大查看"
    changes:
      - type: new
        zh: "用户发送与 Agent 回复里的图片点击放大查看：全屏查看器支持滚轮/捏合缩放、双击放大、拖拽平移，同一消息多图左右切换，Esc/点空白关闭。"
  - version: "0.3.15"
    date: "2026-10-20"
    status: released
    generated: true  # 由 scripts/sync-changelog.py 自动生成，人工润色后删掉这一行
    title:
      zh: "思考卡片思考中摘要随段落前进"
    changes:
      - type: new
        zh: "思考卡片思考中摘要随段落前进，超长右侧渐隐不显示省略号，对齐 Web / Mac；修复流式中的 assistant 行引用不变导致侧栏正文/思考停在首帧不刷新。"
  - version: "0.3.13"
    date: "2026-10-20"
    status: released
    generated: true  # 由 scripts/sync-changelog.py 自动生成，人工润色后删掉这一行
    title:
      zh: "新功能与改进"
      en: "New features"
    changes:
      - type: new
        zh: "卡片紧排与执行中呼吸、运行状态条移到输入框上方、轮次折叠头对齐 Mac。"
  - version: "0.3.12"
    date: "2026-10-19"
    status: released
    title:
      zh: 没装好 DSH 时给出安装引导，路径支持 Windows
      en: A setup guide when DSH is missing, and Windows paths
    changes:
      - type: new
        zh: 本机还没装好 DSH 时，侧栏不再只显示一句看不懂的报错，而是给出安装引导和一键检查/安装命令，装好后自动重新连接。
        en: When DSH isn't set up on this computer, the side panel shows a setup guide with a one-line check/install command instead of a cryptic error, and reconnects automatically once it's ready.
      - type: new
        zh: 首次安装扩展时如果本机还没准备好，会打开欢迎页给出同一份引导；设置的 DSH Server 页也加了「安装引导」入口。
        en: If your computer isn't ready when you first install the extension, a welcome page opens with the same guide, and Settings → DSH Server gains a “Setup guide” entry.
      - type: improved
        zh: 文件夹路径和日志路径支持 Windows，「查看主目录」按钮按系统显示为资源管理器或文件夹。
        en: Folder and log paths work on Windows, and the “Show home folder” button follows the system's naming, such as File Explorer.
  - version: "0.3.11"
    date: "2026-10-19"
    status: released
    title:
      zh: 换上新图标
      en: A new icon
    changes:
      - type: improved
        zh: 扩展换上新图标：黑色圆角底配白色标志，在亮色和暗色工具栏上都清晰可见。
        en: The extension has a new icon, a white logo on a black rounded square that stays clear on both light and dark toolbars.
  - version: "0.3.10"
    date: "2026-10-15"
    status: released
    title:
      zh: 重试与思考状态显示更准确
      en: More accurate retries and thinking state
    changes:
      - type: fixed
        zh: 模型请求重试后，回答排在重试提示之后，重试行随轮次过程一起折叠，用时显示为固定秒数。
        en: After a model request is retried, the answer appears after the retry note, the retry line folds with the turn's process, and its duration shows as a fixed number of seconds.
      - type: fixed
        zh: 思考中的行不再跑到你的消息上方，思考状态和本轮用时正常显示。
        en: The thinking line no longer jumps above your message, and the thinking state and turn duration display correctly.
  - version: "0.3.9"
    date: "2026-10-15"
    status: released
    title:
      zh: 适配 DSH 0.2，新增内置插件设置与自动化入口
      en: DSH 0.2 support, built-in plugin settings and automations
    changes:
      - type: new
        zh: 设置新增「内置插件」页，会话列表可筛选已归档的会话。
        en: Settings gains a “Built-in plugins” page, and the session list can filter archived sessions.
      - type: new
        zh: 新建自动化任务时会打开新会话并预填好提示，说一句就能创建。
        en: Creating an automation opens a new session with a ready-made prompt.
      - type: new
        zh: 运行中的会话底部显示本轮已用时间，思考时也会计时，切换会话后不再归零。
        en: Running sessions show the turn's elapsed time at the bottom, including while thinking, and it no longer resets when you switch sessions.
      - type: improved
        zh: 粘贴文件与拖入效果一致；粘贴文件夹时会把它的完整路径写进输入框。
        en: Pasting files now works like dragging them in, and pasting a folder writes its full path into the composer.
      - type: improved
        zh: 适配 DSH 0.2 与 0.2.1；插话发送的消息在 Agent 取走前就显示在记录末尾，轮次很多时导航条在消息区内滚动。
        en: Updated for DSH 0.2 and 0.2.1; queued interjections appear at the end of the transcript before the agent picks them up, and the turn rail scrolls within the message area when there are many turns.
      - type: fixed
        zh: 轮次折叠方式与 Web 端一致，Agent 的工具变化显示为「工具已更新」提示，不再显示一段原始数据。
        en: Turns fold the same way as on the web, and tool changes show as a “Tools updated” note instead of raw data.
  - version: "0.3.8"
    date: "2026-10-09"
    status: released
    title:
      zh: 上架 Chrome 应用商店，侧栏支持归档与拖拽分组
      en: On the Chrome Web Store, with archiving and drag-to-group
    changes:
      - type: new
        zh: 扩展改用 Chrome 应用商店版本，本地启动器改由浏览器控制插件统一安装。
        en: The extension now ships through the Chrome Web Store, and the local launcher is installed by the browser control plugin.
      - type: new
        zh: 侧栏支持归档会话、拖拽调整历史分组，并新增插件注册表、预设引导与默认工作区。
        en: The side panel can archive sessions and regroup history by dragging, and adds a plugin registry, preset onboarding and a default workspace.
      - type: improved
        zh: 模型设置页与 Web 端规则一致，可编辑模型支持的输入类型；会话搜索与 Web 端一致。
        en: Model settings follow the web UI's rules and let you edit a model's input types, and session search matches the web UI.
      - type: fixed
        zh: 修复子代理入口不随会话实时更新，以及用尖括号写法的本地图片无法显示。
        en: Fixed the subagent entry not updating live with the session, and local images written with angle-bracket paths not displaying.
  - version: "0.3.6"
    date: "2026-09-21"
    status: released
    title:
      zh: 圈选即批注，侧栏对齐 Mac
      en: Annotate as you pick, Mac-style side panel
    changes:
      - type: new
        zh: 圈选页面元素时会在点击处直接弹出批注框，写完即可提交或继续选下一个。
        en: Picking a page element now opens an annotation box right where you clicked, so you can submit or move on to the next one.
      - type: new
        zh: 每轮对话末尾新增「本轮改动文件」卡片，可逐个文件查看改动对比。
        en: A “Files changed this turn” card at the end of each turn lets you review the diff file by file.
      - type: new
        zh: 设置中的插件页改为「插件市场」与「内置插件」两栏，可直接安装、启停和卸载插件；预设页支持复制与删除。
        en: The Plugins settings page now has “Marketplace” and “Built-in” tabs for installing, toggling and removing plugins, and presets can be duplicated or deleted.
      - type: new
        zh: 主题可强制设为浅色或深色，冷启动时不再先闪一下系统配色。
        en: You can force a light or dark theme, and the panel no longer flashes the system theme on launch.
      - type: new
        zh: 本轮用量与用时改为可点击的药丸，点开即可查看详情。
        en: Per-turn usage and duration are now clickable pills that open a details popover.
      - type: improved
        zh: 会话列表入口移到最左侧，改为与 Mac 端一致的左侧抽屉。
        en: The session list now opens as a left-hand drawer from the far-left button, matching the Mac app.
      - type: improved
        zh: Agent 打开网页时会优先复用你已打开的同一页面，结束时也不再关掉你自己的标签页。
        en: When the agent opens a page it now reuses a tab you already have open, and it no longer closes your own tabs when it finishes.
      - type: improved
        zh: 扩展更名为 Deepseek Harness APP，并换上新图标。
        en: The extension is now called Deepseek Harness APP and has a new icon.
      - type: improved
        zh: 历史列表打开更快，圈选元素以清晰的键值卡片展示，并适配新版 DSH 的待发送队列。
        en: The history list opens faster, picked elements show as tidy key-value cards, and the send queue works with the latest DSH.
      - type: fixed
        zh: 修复已结束的旧任务反复弹出「后台任务失败」通知，子代理完成后也会正常提醒。
        en: Fixed stale “Background task failed” notifications popping up for old jobs, and subagents now notify you when they finish.
      - type: fixed
        zh: 修复长会话中图片占用内存不断增长、代码块偶尔吞掉正文、出错时只剩转圈等问题。
        en: Fixed ever-growing image memory in long sessions, code blocks occasionally swallowing text, and errors leaving only a spinner.
      - type: fixed
        zh: macOS 上「停止生成」快捷键改为 ⌘Esc，不再被弹出层抢走；Agent 输入文字时也不再抢走标签页焦点。
        en: On macOS “Stop generating” is now ⌘Esc so popovers can’t swallow it, and agent typing no longer steals focus from your tab.
  - version: "0.3.1-build.21"
    date: "2026-09-05"
    status: released
    title:
      zh: 适配 DSH 0.1.2，会话更稳定
      en: DSH 0.1.2 support and steadier sessions
    changes:
      - type: improved
        zh: 扩展已适配 DSH 0.1.2。
        en: The extension now works with DSH 0.1.2.
      - type: fixed
        zh: 切换会话时会清空附件，附件读取中暂不允许发送，移除附件也不再错位。
        en: Attachments are cleared when you switch sessions, sending waits until they finish loading, and removing one no longer removes the wrong item.
      - type: fixed
        zh: 发送失败后「发送」按钮会恢复可用，新建会话失败也会给出提示。
        en: The “Send” button re-enables after a failed prompt, and failed new sessions now show an error.
      - type: fixed
        zh: 切换会话或模型后，推理档位会作用到正确的模型上。
        en: Reasoning level now applies to the right model after switching sessions or models.
      - type: fixed
        zh: 修复后台会话不再刷新、会话列表丢失实时变化以及对话内容出现缺口的问题。
        en: Fixed background sessions not refreshing, the session list dropping live updates, and gaps in the transcript.
      - type: fixed
        zh: 附件校验错误提示已支持中英文。
        en: Attachment validation errors are now localized.
  - version: "0.3.1-build.18"
    date: "2026-09-02"
    status: released
    title:
      zh: Git 入口、插件管理与快捷键
      en: Git control, plugin management and shortcuts
    changes:
      - type: new
        zh: 聊天区右上角新增 Git 入口，可查看当前分支和改动量，并切换、新建分支或推送拉取。
        en: A Git control in the chat header shows the branch and pending changes, and lets you switch or create branches and push or pull.
      - type: new
        zh: 设置里可直接安装、更新、卸载插件，也能一键重启或更新 DSH。
        en: You can install, update and remove plugins, and restart or update DSH, straight from settings.
      - type: new
        zh: 底栏新增「携带当前页面上下文」开关，打开后下一条消息会让 Agent 知道你正在看的页面。
        en: A new “Include current page” switch in the composer tells the agent which tab you’re viewing with your next message.
      - type: new
        zh: 会话列表支持按最近、状态或手动拖拽排序，每行显示运行中、已完成、出错的状态灯。
        en: The session list can be sorted by recent, status or manual drag order, and each row shows a running, finished or error dot.
      - type: new
        zh: 设置新增「快捷键」页，并支持拖入图片作为附件、渲染数学公式与 Markdown 图片。
        en: A new “Shortcuts” settings tab, plus drag-and-drop images, math formulas and Markdown images in chat.
      - type: improved
        zh: 移除容易误关的浏览器控制开关，连接状态显示更清楚；扩展图标也已更新。
        en: The easy-to-forget browser control switch is gone in favor of a clearer connection status, and the icon has been refreshed.
      - type: fixed
        zh: 修复输入法选词时误提交消息或误打开会话的问题。
        en: Fixed confirming an input-method candidate accidentally sending a message or opening a session.
      - type: fixed
        zh: 修复预设菜单无法切回上一个预设、推理档作用到旧模型等问题。
        en: Fixed not being able to switch back to the previous preset and reasoning level applying to the old model.
  - version: "0.3.1-build.13"
    date: "2026-08-30"
    status: released
    title:
      zh: 会话切换更顺畅
      en: Smoother session switching
    changes:
      - type: improved
        zh: 切换工作目录或打开会话时会显示加载动画，不再出现空白或残留旧内容。
        en: Switching workspaces or opening a session now shows a loading animation instead of a blank or stale view.
      - type: fixed
        zh: 修复点击会话列表后聊天记录不切换的问题。
        en: Fixed the transcript not changing after clicking a session in the list.
  - version: "0.3.1-build.11"
    date: "2026-08-30"
    status: released
    title:
      zh: 子代理目录与工作目录筛选
      en: Subagent catalog and workspace filtering
    changes:
      - type: new
        zh: 侧栏顶部新增子代理目录，显示子代理数量，点击即可查看其只读会话。
        en: A subagent catalog in the panel header shows how many subagents are running and opens each one read-only.
      - type: new
        zh: 工作目录可以直接在系统中打开。
        en: You can now open the workspace folder in your system file browser.
      - type: improved
        zh: 选中某个工作目录时，历史列表只显示属于它的会话。
        en: Selecting a workspace now filters the history list to that workspace’s sessions.
      - type: fixed
        zh: 修复搜索结果中目录名被截断、点击工作目录菜单时历史浮层误关闭的问题。
        en: Fixed truncated folder names in search results and the history popover closing when using the workspace menu.
  - version: "0.3.1-build.9"
    date: "2026-08-30"
    status: released
    title:
      zh: 侧栏更可靠，新增后台任务面板
      en: A sturdier side panel with background jobs
    changes:
      - type: new
        zh: 新增后台任务面板，并可查看和中断子代理。
        en: A new background jobs panel, plus the ability to list and interrupt subagents.
      - type: improved
        zh: Agent 现在可以打开 file、about、data 等任意可访问的地址，不再仅限网页。
        en: The agent can now open any navigable address, including file, about and data URLs, not just web pages.
      - type: improved
        zh: 断线后会自动重连，也可点击状态点手动重连，工具结果不会因断线而丢失。
        en: The panel reconnects automatically after a drop, you can tap the status dot to reconnect, and tool results survive disconnects.
      - type: improved
        zh: 流式输出、会话列表与搜索更流畅，长列表也不再卡顿。
        en: Streaming replies, the session list and search are smoother, even with long histories.
      - type: fixed
        zh: 快速切换会话时，迟到的结果不会再覆盖当前会话。
        en: Late results no longer overwrite the current session when you switch quickly.
