# Chrome 扩展 更新日志 —— 由 git 历史整理，供 /whatsnew/ 页面使用
entries:
  - version: "0.3.19"
    date: "2026-10-25"
    status: released
    generated: true  # 由 scripts/sync-changelog.py 自动生成，人工润色后删掉这一行
    title:
      zh: "问题修复"
      en: "Bug fixes"
    changes:
      - type: fixed
        zh: "插件「更新」在开着 HMR 的 dsh web 上报 already-installed——宿主 HMR 下不许原地换版本，改按宿主给的路先 removeBundle 再装（与 web 插件页的更新一致，当场生效不必重启），新版装不上就把原版本装回去；卸载前宿主会先停用插件，停不下来（bundle-in-use / stop-profile，典型是启动后 profile 依赖又变过、只能重启才能换代码）时宿主会把它留在停用状态，这里把开关拨回去，并改成「重启服务并更新」：确认后重启 dsh web、重读清单再走一遍，重启不了就请用户手动重启；加测试守住。"
  - version: "0.3.18"
    date: "2026-10-23"
    status: released
    generated: true  # 由 scripts/sync-changelog.py 自动生成，人工润色后删掉这一行
    title:
      zh: "新功能与问题修复"
      en: "New features and fixes"
    changes:
      - type: new
        zh: "新用户首次使用、没有任何可用模型提供方时弹「添加一个 API Key 开始使用」引导，对齐 Mac DeepSeekOnboardingDialog——判定与 web onboardingReadiness 同口径（任一提供方可用即不弹；官方 DeepSeek 路由缺席/未启用/凭证只读时也不弹），填 key 写入官方凭证引用并刷新模型菜单，「配置其他模型提供商」/Esc 跳到设置 → 模型。"
      - type: fixed
        zh: "「启用完全访问?」确认框补回视口居中——全局 * { margin:0 } 盖掉了 UA 的 margin:auto，弹窗贴在左上角；加测试守住侧栏所有 <dialog> 都写回居中。"
      - type: fixed
        zh: "「想手动一步步安装?」展开后不再被 3s 轮询自动收起——重绘时保留用户的展开/收起状态，后台检测结果未变时不重绘。"
