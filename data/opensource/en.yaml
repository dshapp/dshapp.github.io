title: "Open source & security"
subtitle: "Open-source plugins and relay, end-to-end encrypted remote access, and a published security review."
intro: "These extensions put DSH in your browser, on your desktop and on your phone, so they deserve a close look at how they work. The browser control, remote connection, relay and computer-use plugins are open source — read them, build them, deploy them yourself; source for the macOS and Android clients, the WeChat mini program and the Chrome extension will follow. The only public component of mobile access is the relay, and it holds none of your data. We also ran an adversarial security review of remote access; the conclusions and fix details are below."

pillars:
  - icon: "github"
    title: "Open at the core"
    body: "One repository per component — read it, self-host it, build it yourself, with the build scripts included."
    points:
      - "Five core repositories published under the MIT license; client source to follow"
      - "The relay dsh-proxy is a single-port Rust implementation that holds no key able to decrypt your traffic and keeps no disk state"
      - "Point clients at your own relay instead of our hosting"
  - icon: "lock"
    title: "Secure"
    body: "Remote access opens no port, writes no state file and leaves nothing to restore. Pairing credentials are single-use."
    points:
      - "Noise_IK end-to-end encryption: a device gets not one byte before the handshake completes"
      - "No listening port, no state file, no extra daemon process"
      - "One pairing code per device, expiring after 5 minutes"
      - "Chrome control reuses your signed-in browser and never uploads cookies"
  - icon: "shield"
    title: "Auditable"
    body: "We ran a full adversarial security review of our own remote access path. All eight findings are fixed or narrowed, and published."
    points:
      - "The review carries reproducible attack scripts and live measurements, not a paper checklist"
      - "Every finding records how it was fixed and the post-fix measurement"
      - "Browser control accepts connections only from the extension itself; cookies never leave the browser"
      - "Phones reach only allowlisted endpoints; pairing and revoking happen on the computer only"

auditTitle: "Security review: eight findings, all fixed or narrowed"
auditSub: "We played an internet attacker trying to break into your Mac through the public relay, in an adversarial review of the remote-connection components (dsh-mobile-bridge and dsh-proxy)."
auditSummary:
  - "<strong>No way around pairing</strong>: without a valid device key or a live pairing code your Mac is unreachable; no pre-auth remote code execution or fake-device path was found."
  - "<strong>All eight findings addressed</strong>: seven fixed, one narrowed — each with how it was fixed and post-fix measurements."
  - "<strong>Residual risks published</strong>: such as needing to upgrade relay and clients together, and paired devices remaining full clients — with the remedy for each."
auditToggle: "Show all eight findings and fixes"
auditNote: "Summary of the review's conclusions. The review also recorded what it could not break: the Mac was unreachable without a valid device key or a live pairing token, and no pre-auth RCE or fabricated-device path was found."

audit:
  - id: "V1"
    title: "A paired phone could mint new pairing QR codes"
    severity: "High"
    level: "high"
    status: "Fixed"
    fix: "mobileBridge/* now returns 403 to phones and stays reachable only over the Mac app's authenticated local channel. Measured: 403 from a phone, 200 from localhost."
  - id: "V2"
    title: "A paired phone could enumerate status and revoke any device"
    severity: "High"
    level: "high"
    status: "Fixed"
    fix: "Moved out of phone reach together with V1."
  - id: "V3"
    title: "A reached device got the entire /api, including file read/write and agent RPC"
    severity: "Critical"
    level: "critical"
    status: "Narrowed"
    fix: "The mobile channel now uses a default-deny exact-route allowlist (/api/file, /api/session/uploadFileBinary, /api/remote.mux, extensible by config); unlisted plugin routes return 404."
  - id: "V4"
    title: "Revoking a device did not terminate its live sessions"
    severity: "High"
    level: "high"
    status: "Fixed"
    fix: "The registry keeps a dispose handle per live connection, called by revoke and TTL expiry. Measured: a revoked device's session dropped in about 0 ms, previously 30 s or more."
  - id: "V5"
    title: "Relay: unbounded unauthenticated bridge registrations"
    severity: "High"
    level: "high"
    status: "Fixed"
    fix: "Admission control before the handshake: a global permit pool (--max-bridges, 1024) plus a per-IP RAII guard (--max-bridges-per-ip, 32). Measured: 3000 rogue bridges from one address — 31 admitted, RSS delta 0 MB, previously 3000 admitted at +180 MB."
  - id: "V6"
    title: "Relay: unauthenticated attacker could exhaust one bridge's stream budget and lock out the victim"
    severity: "High"
    level: "high"
    status: "Fixed"
    fix: "The preamble and the Noise_IK handshake share one 10 s deadline, and the relay's stream slot is an atomic semaphore reservation rather than check-then-insert. Measured: 2100 silent streams all reaped, a real phone served 10 ms later, previously denied indefinitely."
  - id: "V7"
    title: "Relay: no timeout around the XX handshake (slowloris)"
    severity: "Medium"
    level: "medium"
    status: "Fixed"
    fix: "The whole XX handshake is wrapped in --handshake-timeout-ms (10 s), and the handshake frame length is validated against a 1 KiB ceiling before allocation instead of reserving a 64 KiB buffer per connection."
  - id: "V8"
    title: "Relay inbox bounded by frame count, and the stream-cap check was TOCTOU"
    severity: "Low-Medium"
    level: "low"
    status: "Fixed"
    fix: "A stream that overruns its inbox loses only that stream (the relay sends KIND_CLOSE and reclaims its credit); the stream cap is now an atomic permit held for the stream's lifetime."

safeTitle: "What the review could not break"
safe:
  - "No relay-side routing-key hijack: the routing key comes from the handshake static key, so a third party cannot register a bridgeKey it does not hold."
  - "The per-device gate holds: unpaired devices are refused, the pairing token is single-use, and a wrong magic is refused."
  - "Frame sizes are bounded: no length-prefix-driven unbounded allocation."
  - "No reachable panic in the relay's parse paths under panic=abort."

residualTitle: "Known residual risk (published as-is)"
residual:
  - "A stale bridge keeps V6 open: the relay's permit stops it over-issuing slots, but releasing them depends on the bridge's timeout, so relay and clients must be upgraded together."
  - "The RPC channel is still the whole RPC surface: the allowlist removes plugin routes a phone has no business calling, but a paired device is still a full harness client by design — V3 is narrowed, not eliminated. Revoking a lost phone is the intended remedy, and it now takes effect immediately."
  - "Per-IP bridge caps don't suit shared egress: behind an L4 load balancer or a large NAT every bridge presents the same address, so --max-bridges-per-ip must then be raised deliberately."

