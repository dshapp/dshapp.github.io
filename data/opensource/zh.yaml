title: "开源与安全"
subtitle: "插件与中转开源，远程访问端到端加密，安全评审结果公开。"
intro: "这些扩展让 DSH 碰到了你的浏览器、桌面和手机，所以值得你先看清它们怎么工作。浏览器控制、远程连接、中转与电脑操作插件都已开源，可以阅读、自行编译和部署；macOS、Android 客户端与 Chrome 扩展的源码将陆续公开。手机远程访问唯一的公网组件是中转服务器，它不持有任何用户数据。我们还对远程访问做了一次对抗性安全评审，结论与修复细节都在下面。"

pillars:
  - icon: "github"
    title: "核心开源"
    body: "每个组件一个仓库，源码可读、可自建、可自行编译，构建脚本随仓库提供。"
    points:
      - "5 个核心仓库以 MIT 许可发布，客户端源码将陆续公开"
      - "远程中继 dsh-proxy 是 Rust 单端口实现，不持有任何能解密内容的密钥，无磁盘状态"
      - "可以指向自己的中转服务，不依赖我们的托管"
  - icon: "lock"
    title: "安全"
    body: "远程访问默认是「不开放端口、不落盘、不留状态」的形态，配对凭据一次一码。"
    points:
      - "Noise_IK 端到端加密：设备必须先完成握手才拿得到一个字节"
      - "不监听端口、不写状态文件、不额外常驻进程"
      - "配对码一码一台设备，5 分钟后失效"
      - "Chrome 控制复用你已登录的浏览器，不上传 Cookie"
  - icon: "shield"
    title: "可审核"
    body: "我们对自己的远程访问做过一次完整的对抗性安全评审，8 个发现均已修复或收窄，并公开记录。"
    points:
      - "评审含可复现的攻击脚本与实测数据，不是纸面检查"
      - "每个发现都记录修复方式与修复后的实测测量值"
      - "浏览器控制只接受扩展本身的连接，Cookie 不离开浏览器"
      - "手机只能访问白名单接口，配对与吊销只能在电脑上操作"

auditTitle: "安全评审：8 个问题，均已修复或收窄"
auditSub: "我们模拟互联网上的攻击者，尝试经公网中转服务器入侵你的 Mac，对远程连接组件（dsh-mobile-bridge 与 dsh-proxy）做了一次对抗性评审。"
auditSummary:
  - "<strong>没有找到绕过配对的入口</strong>：没有有效的设备密钥或实时配对码，就无法触达你的 Mac；未发现预认证远程代码执行或伪造设备的路径。"
  - "<strong>发现的 8 个问题都已处理</strong>：7 个已修复，1 个已收窄范围；每一条都附有修复方式和修复后的实测数据。"
  - "<strong>残留风险如实公开</strong>：包括需要中转与客户端一起升级、已配对设备仍是完整客户端等，并给出对应的补救方式。"
auditToggle: "查看 8 条发现与修复细节"
auditNote: "以下为评审结论摘要。评审同时确认了「未发现」的部分：无法在无有效设备密钥或实时配对令牌的情况下触达 Mac，未发现预认证 RCE 或伪造设备路径。"

audit:
  - id: "V1"
    title: "已配对手机可以签发新的配对二维码"
    severity: "高"
    level: "high"
    status: "已修复"
    fix: "mobileBridge/* 对手机一律返回 403，仅保留 Mac 应用本地的已认证通道；实测：手机调用 403，本机 200。"
  - id: "V2"
    title: "已配对手机可以枚举状态并吊销任意设备"
    severity: "高"
    level: "high"
    status: "已修复"
    fix: "同上，随 V1 一起移出手机可达范围。"
  - id: "V3"
    title: "被触达的设备拿到整个 /api，含文件读写与 agent RPC"
    severity: "严重"
    level: "critical"
    status: "已收窄"
    fix: "移动通道改为默认拒绝的精确路由白名单（/api/file、/api/session/uploadFileBinary、/api/remote.mux，可由配置扩展）；未列出的插件路由 404。"
  - id: "V4"
    title: "吊销设备不会终止已建立的会话"
    severity: "高"
    level: "high"
    status: "已修复"
    fix: "注册表为每个连接保留 dispose 句柄，吊销与 TTL 到期都会销毁套接字；实测：被吊销设备的会话约 0 ms 断开（原先 ≥30 秒）。"
  - id: "V5"
    title: "中继：无上限的未认证网关注册"
    severity: "高"
    level: "high"
    status: "已修复"
    fix: "握手前做准入控制：全局许可池（--max-bridges，1024）加每 IP 的 RAII 守卫（--max-bridges-per-ip，32）；实测：3000 个同地址恶意网关只准入 31 个，RSS 增量 0 MB（原先 3000 个全进，+180 MB）。"
  - id: "V6"
    title: "中继：未认证即可耗尽单网关的流量额度，定向锁死受害者"
    severity: "高"
    level: "high"
    status: "已修复"
    fix: "preamble 与 Noise_IK 共用 10 秒 deadline；中继的流额度改为原子 Semaphore 预留，不再是 check-then-insert；实测：2100 条静默流全部回收，真实手机随后 10 ms 内被服务（原先被无限期拒绝）。"
  - id: "V7"
    title: "中继：XX 握手无超时（slowloris）"
    severity: "中"
    level: "medium"
    status: "已修复"
    fix: "整个 XX 握手包在 --handshake-timeout-ms（10 秒）内，握手帧长度在分配前先按 1 KiB 上限校验，不再每连接预留 64 KiB 缓冲。"
  - id: "V8"
    title: "中继收件箱按帧数封顶，且流额度检查存在 TOCTOU"
    severity: "低-中"
    level: "low"
    status: "已修复"
    fix: "超出收件箱的流只丢自己（中继发 KIND_CLOSE 并收回额度），流上限改为持有整个生命周期的原子许可。"

safeTitle: "评审确认未发现的问题"
safe:
  - "中继侧无法劫持路由密钥：路由密钥取自握手静态密钥，第三方无法注册自己不持有的 bridgeKey。"
  - "每设备门禁成立：未配对设备被拒、配对令牌一次性、错误 magic 被拒。"
  - "帧长有界：无由长度前缀驱动的无界分配。"
  - "中继解析路径在 panic=abort 下没有可达 panic。"

residualTitle: "已知残留风险（如实公开）"
residual:
  - "旧版 bridge 会让 V6 仍然成立：中继的许可阻止超额发放，释放额度依赖 bridge 的超时，因此中继与客户端需一起升级。"
  - "RPC 通道仍是完整的 RPC 面：白名单移除了手机不该调的插件路由，但已配对设备按设计仍是完整 harness 客户端 —— V3 是被收窄，不是被消除。吊销丢失的手机是既定补救方式，且现在立即生效。"
  - "每 IP 网关上限不适合共享出口：在 L4 负载均衡或大型 NAT 后面所有 bridge 同一地址，需有意调高 --max-bridges-per-ip。"

