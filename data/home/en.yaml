# Homepage copy (English). Positioning: an extension suite for DSH — readers already use DSH (dsh web).
title: Take DSH to your desktop, browser and phone
subtitle: A set of extensions built for DSH — a desktop app crafted natively for the Mac, an Android client and a WeChat mini program, an agent that drives your signed-in Chrome and your Mac apps, and a phone that can take over when you step away. It plugs into the dsh you already run, with the same sessions, config and plugins.
