macos:
  eyebrow: macOS app · Built for Mac users
  title: DSH, made for the Mac
  body: Not a wrapped web page, not a cross-platform framework. Built natively with SwiftUI and AppKit for Apple Silicon, in a download of about 14 MB — it feels like an app that came with your Mac.
  points:
  - icon: apple
    title: Native all the way down
    body: Sidebar, split views, lists and the composer are system controls. Scrolling and momentum match the system, streaming output doesn't jump, and input methods never send half-composed text.
  - icon: grid
    title: Drive it from the keyboard
    body: Nearly everything lives in the menu bar — switch models, adjust thinking effort, enter Plan mode, approve or deny requests, interject. Common actions have shortcuts; ⌘/ shows them all.
  - icon: message-square
    title: System notifications
    body: While you're busy elsewhere, macOS notifies you when a task finishes, fails, or needs your answer or approval. Click the notification to jump straight to that session.
  - icon: folder-plus
    title: At home with Finder
    body: Drag files or images into the composer to attach them; preview with Quick Look, reveal deliverables in Finder, and open the workspace in the editor of your choice.
  - icon: terminal
    title: Built-in terminal
    body: ⌘J brings up a terminal panel with tabs, right below the conversation — no switching windows.
  - icon: sparkles
    title: Follows your Mac
    body: Light, dark or match the system, and it respects Reduce Motion. The trajectory inspector has a timeline, so every step's timing and details are easy to read.
  footnote: It plugs straight into your local dsh service — sessions, model config and plugins are shared with dsh web, and “⇧⌘,” opens the web UI any time.
  more: More about the macOS app
chrome:
  eyebrow: Chrome extension + dsh-chrome-control plugin
  title: Give DSH your signed-in Chrome
  body: The plugin gives the agent 27 mcp__chrome__* browser tools and the extension carries them out in your Chrome. The extension's side panel is also a full DSH client.
  bullets:
  - '<strong>Your logins</strong>: the same profile, logins and open tabs — admin panels and internal tools just work, and cookies never leave the browser.'
  - '<strong>Stays out of your way</strong>: real clicks and keystrokes run in background tabs; it reuses pages you already have open and never closes your own tabs.'
  - '<strong>Pick + annotate</strong>: pick an element on the page and jot down what you want; or bring the current page into the conversation as context.'
  - '<strong>The side panel is a client</strong>: sessions, Git branches and changes, plugin management, background tasks and subagents — all from Chrome''s side panel.'
  - '<strong>Big pages stay smooth</strong>: browser control runs in a separate native service, on macOS, Linux and Windows.'
  shot: /img/shots/chrome-picker.jpg
  shotAlt: 'Picking the Buy now button on a page and annotating it, with DSH in the side panel'
  shot2: /img/shots/chrome-sidepanel.jpg
  shot2Alt: The DSH client in Chrome's side panel
  toolsNote: Install it in one click from Settings → Browser in the Mac app, or add the plugin from the command line and the extension from the Chrome Web Store.
  install: dsh plugin --profile web add dsh-chrome-control
cu:
  eyebrow: Computer use · dsh-kimi-computer-use plugin
  title: Let DSH operate Mac apps that have no API
  body: The plugin connects Kimi Computer Use to DSH as 11 mcp__cu__* tools. The agent understands the interface through the accessibility tree and screenshots, then clicks, types and drags in the background.
  bullets:
  - '<strong>Leaves your mouse alone</strong>: input is delivered in the background, even to covered windows, so you keep working.'
  - '<strong>Targets controls</strong>: no memorized coordinates — moved windows and new resolutions don''t throw it off.'
  - '<strong>Checks every step</strong>: a bundled skill re-reads the interface before and after each action to confirm the result.'
  - '<strong>Asks before risky actions</strong>: before sending, deleting, purchasing or publishing, it explains what will happen and waits for your OK.'
  shot: /img/shots/cu.jpg
  shotAlt: DSH creating a Reminders list and adding to-dos through computer use
  toolsNote: Install KimiCU.app from Kimi's official channel first, keep it running, and grant it Accessibility and Screen Recording in System Settings. Settings → Computer use in the Mac app checks each step.
  install: dsh plugin --profile web add dsh-kimi-computer-use
mobile:
  eyebrow: Remote access · dsh-mobile-bridge plugin + Android app / WeChat mini program
  title: Step away without stalling your tasks
  body: "The plugin hands your DSH to paired phones over an end-to-end encrypted channel: the Android app is the native client in your pocket, and iPhone users can use the WeChat mini program DSH Remote."
  bullets:
  - '<strong>No open ports</strong>: your computer dials out to a public relay that only forwards ciphertext — it can''t read anything, and you can run your own.'
  - '<strong>Pair by QR code</strong>: codes last 5 minutes and work once; manage devices from the Mac app sidebar or the /mobileaccess page of dsh web.'
  - '<strong>Take over from your phone</strong>: follow the conversation and changed files live, handle approvals and questions, add instructions, stop background tasks; the Android app also pushes progress notifications.'
  - '<strong>Take it back any time</strong>: revoking a device drops it instantly, or cut off all phone access in one click.'
  shot: /img/shots/remote-pairing.jpg
  shotAlt: The Mobile Access page shows a pairing code while the phone answers the agent's question
  toolsNote: The plugin runs inside the dsh service, so any computer running dsh web can use it — not just the Mac app.
  install: dsh plugin --profile web add dsh-mobile-bridge
  more2: WeChat Mini Program
  more2Href: products/miniapp/

setupTitle: Two ways to set it up
setupSub: Turn everything on from the Mac app, or install piece by piece from the command line.
setupAppTitle: With the macOS app (recommended)
steps:
- title: Download and open
  body: It attaches to the dsh already running on your machine; if there isn't one, it installs Node.js and @deepseek-ai/dsh after asking you.
- title: Turn on extensions in Settings
  body: The Browser and Computer use tabs install their plugins in one click and check connections and permissions; Mobile access in the sidebar shows a pairing code.
- title: Add the other half
  body: Add the extension from the Chrome Web Store, install KimiCU.app from Kimi's official channel, and scan with the Android app or the WeChat mini program DSH Remote.
setupCliTitle: Command line only
setupCliBody: Browser control and remote access are ordinary dsh plugins that install on dsh for macOS, Linux and Windows; computer use needs macOS.
setupCli: |-
  # Browser control (then add the extension from the Chrome Web Store)
  dsh plugin --profile web add dsh-chrome-control

  # Computer use (install KimiCU.app first; macOS only)
  dsh plugin --profile web add dsh-kimi-computer-use

  # Remote access (then open /mobileaccess in dsh web and scan)
  dsh plugin --profile web add dsh-mobile-bridge
stepsLink: Full install guides
stepsHref: docs/

trustTitle: It can do more, with clearer boundaries
trustSub: The extensions put the agent in your browser, your desktop and your phone — so each one comes with limits.
trust:
- icon: chrome
  title: Cookies stay in the browser
  body: Browser control reuses your logins but never uploads cookies, and only the extension itself can connect to the control channel — ordinary pages can't, even if they find the address.
- icon: lock
  title: The relay sees nothing
  body: Phone and computer are end-to-end encrypted with no open ports; the relay only moves ciphertext, stores nothing, and can be swapped for your own.
- icon: smartphone
  title: Phones do only what they should
  body: A phone reaches only allowlisted endpoints; pairing and revoking happen on the computer only, and revocation drops live connections at once.
- icon: shield
  title: Risky actions ask first
  body: The computer-use skill explains sending, deleting, purchasing or publishing before doing it, and remote access has been through a published adversarial security review.
trustLink: Open source repos & security review
trustHref: opensource/

faqTitle: FAQ
faq:
- q: Do I need DSH installed first?
  a: Not with the Mac app — it attaches to the dsh you already have, or installs Node.js and @deepseek-ai/dsh after asking you. For command-line use, you need dsh first.
- q: Will it clash with the dsh web I'm already running?
  a: No. The Mac app probes port 3080 first and attaches to a running dsh instead of starting another. Sessions, model config and plugins are shared, and ⇧⌘, opens the web UI.
- q: Can I use the extensions without the Mac app?
  a: Yes. Browser control and remote access are ordinary dsh plugins for dsh on macOS, Linux and Windows; phone pairing happens on the /mobileaccess page of dsh web. Computer use needs macOS.
- q: Will browser control mess with the Chrome I'm using?
  a: Cookies are never uploaded. The agent reuses pages you already have open, sends real input to background tabs, and doesn't close your own tabs when it's done. To keep it out of your browser, disable the extension.
- q: What does computer use need?
  a: A Mac with KimiCU.app installed from Kimi's official channel and running, with Accessibility and Screen Recording granted to KimiCU.app in System Settings. KimiCU does the actual work; the plugin connects it to DSH.
- q: Does remote access need a public IP? Can the relay see my data?
  a: No public IP and no open ports — your computer dials out to the relay. Phone and computer are end-to-end encrypted; the relay reads only the routing header, then forwards ciphertext without storing or logging it.
- q: Do the extensions cost anything?
  a: No. The plugins and relay are MIT-licensed open source; model costs are whatever your DSH model provider charges.
faqMore: More questions
faqHref: docs/faq/

