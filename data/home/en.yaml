painsTitle: What DSH couldn't reach, it now can
painsSub: Each extension removes one specific hassle.
painsBefore: Before
painsAfter: Now
pains:
- icon: apple
  tag: macOS app
  href: products/macos/
  before: Using DSH meant babysitting dsh web in a terminal plus a browser tab — no menu bar, no shortcuts, no notification when a task finished. Service down or a plugin to install? Back to the command line.
  after: A native app built for the Mac — menu bar, shortcuts, system notifications and Quick Look — that also takes over your local dsh service and turns on extensions in one click.
- icon: globe
  tag: Browser control
  href: products/chrome/
  before: The agent couldn't get into admin panels or internal tools behind a login, and a clean browser meant signing in to every site again.
  after: The agent uses your signed-in Chrome — clicking, filling and reading in background tabs without disturbing the page you're on.
- icon: chrome
  tag: Chrome side panel
  href: products/chrome/
  before: To get the agent to change a button, you took a screenshot, described where it was, copied a selector and pasted it back into DSH.
  after: Pick the element on the page, add a note, and it lands in DSH's composer. The side panel is a full DSH client in its own right.
- icon: cu
  tag: Computer use
  href: products/cu/
  before: Desktop apps with no API and no CLI were simply out of DSH's reach.
  after: With Kimi Computer Use connected, the agent reads and operates Mac apps in the background, without taking your mouse or windows.
- icon: lock
  tag: Remote access
  href: products/android/
  before: Using DSH on your home or office machine from elsewhere meant opening ports, tunneling or a VPN — fiddly and worrying.
  after: Add the mobile-bridge plugin, scan a QR code, and you're in — end-to-end encrypted, with no open ports on your computer.
- icon: smartphone
  tag: Android app
  href: products/android/
  before: A long task stalls on one approval while you're away from your desk, and you can't tell whether it finished or failed.
  after: Your phone gets notified; approve, answer questions, add instructions or stop background tasks right there.

