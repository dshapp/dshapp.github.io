macos:
  eyebrow: macOS App · 为 Mac 用户打造
  title: 为 Mac 而生的 DSH
  body: 不是网页套壳，也不是跨平台框架。SwiftUI 与 AppKit 原生实现，Apple Silicon 原生构建，安装包约 14 MB —— 用起来就像 Mac 自带的 App。
  points:
  - icon: apple
    title: 原生到每一处
    body: 侧边栏、分栏、列表、输入框都是系统控件。滚动和惯性与系统一致，长会话流式输出也不跳动；中文输入法选词不会误发送。
  - icon: grid
    title: 键盘就能驾驭
    body: 几乎所有操作都在菜单栏里：切模型、调思考强度、进出 Plan 模式、批准或拒绝请求、插话发送。常用操作都有快捷键，⌘/ 一键看全。
  - icon: message-square
    title: 系统通知
    body: 你在忙别的事时，任务完成、失败、等你回答或批准，都会推送 macOS 通知；点一下通知，直接回到那个会话。
  - icon: folder-plus
    title: 和 Finder 无缝衔接
    body: 文件和图片拖进输入框就是附件；预览用快速查看（Quick Look），交付文件一键「在 Finder 中显示」，工作区用你选定的编辑器打开。
  - icon: terminal
    title: 内置终端
    body: ⌘J 呼出终端面板，支持多个标签页，就在会话下方，不用再切到别的窗口。
  - icon: sparkles
    title: 跟随你的 Mac
    body: 浅色、深色或跟随系统；尊重「减少动态效果」。轨迹检查器带时间线，每一步的耗时和细节都看得清。
  footnote: 它直接接入你本机的 dsh 服务：会话、模型配置、插件与 dsh web 完全互通，按「⇧⌘,」随时打开 Web 端。
  more: 了解 macOS App
chrome:
  eyebrow: Chrome 扩展 + dsh-chrome-control 插件
  title: 让 DSH 用上你已登录的 Chrome
  body: 插件给 Agent 提供 27 个 mcp__chrome__* 浏览器工具，扩展负责在你的 Chrome 里执行；扩展的侧栏本身也是一个完整的 DSH 客户端。
  bullets:
  - <strong>复用登录态</strong>：同一个配置文件、同一批登录态和已打开的标签页，公司后台、内部系统直接可用，Cookie 不离开浏览器。
  - <strong>不打扰你</strong>：真实点击和键盘输入在后台标签页执行；优先复用你已打开的页面，结束时不关你自己的标签页。
  - <strong>圈选元素 + 批注</strong>：在页面上圈出元素、顺手写一句要求；还可以把当前页面作为上下文带进对话。
  - <strong>侧栏即客户端</strong>：会话、Git 分支与改动、插件管理、后台任务与子代理，都能在浏览器侧栏里完成。
  - <strong>大页面不卡</strong>：浏览器控制由独立的原生后台服务承担，支持 macOS、Linux 与 Windows。
  shot: /img/shots/chrome-picker.jpg
  shotAlt: 在网页上圈选「立即购买」按钮并写下批注，侧栏里就是 DSH
  shot2: /img/shots/chrome-sidepanel.jpg
  shot2Alt: Chrome 侧边栏中的 DSH 客户端
  toolsNote: 在 Mac App 的「设置 → 浏览器」一键安装；或在命令行装插件，再从 Chrome 应用商店添加扩展。
  install: dsh plugin --profile web add dsh-chrome-control
cu:
  eyebrow: 电脑操作 · dsh-kimi-computer-use 插件
  title: 让 DSH 操作 Mac 应用
  body: 插件把 Kimi Computer Use 接入 DSH，提供 11 个 mcp__cu__* 工具：Agent 通过辅助功能树和截图看懂界面，再在后台点击、输入、拖拽。
  bullets:
  - <strong>不抢鼠标和前台</strong>：输入在后台投递，窗口被遮住也能操作，你可以继续用电脑。
  - <strong>按控件定位</strong>：不靠死记坐标，窗口挪了位置、换了分辨率照样点得准。
  - <strong>每一步都核对</strong>：内置操作技能，操作前后重新读取界面，确认结果再往下走。
  - <strong>危险动作先确认</strong>：发送、删除、购买、发布之前，先说明要做什么，等你点头。
  shot: /img/shots/cu.jpg
  shotAlt: DSH 通过电脑操作在「提醒事项」里新建列表并逐条添加待办
  toolsNote: 需要先从 Kimi 官方渠道安装 KimiCU.app 并保持运行，在系统设置里给它授予「辅助功能」与「屏幕录制」。Mac App 的「设置 → 电脑操作」会逐项检查。
  install: dsh plugin --profile web add dsh-kimi-computer-use
mobile:
  eyebrow: 手机远程 · dsh-mobile-bridge 插件 + Android App
  title: 离开电脑，任务也不会卡住
  body: 插件把你的 DSH 经端到端加密通道交给已配对的手机，Android App 就是口袋里的 DSH 客户端。
  bullets:
  - <strong>不开端口</strong>：电脑主动连到公网中转，中转只转发加密数据、读不到内容，也可以自己部署。
  - <strong>扫码配对</strong>：配对码 5 分钟有效、只能用一次；在 Mac App 侧栏或 dsh web 的 /mobileaccess 页面管理设备。
  - <strong>手机上接管任务</strong>：实时看对话和改动文件，处理审批与提问，追加指令、停止后台任务，进展推送通知。
  - <strong>随时收回</strong>：吊销设备立即断开；也可以一键临时切断所有手机访问。
  shot: /img/shots/remote-pairing.jpg
  shotAlt: 电脑上的移动端访问页生成配对码，手机上直接回答 Agent 的提问
  toolsNote: 插件随 dsh 服务一起运行，任何跑着 dsh web 的电脑都能用，不限于 Mac App。
  install: dsh plugin --profile web add dsh-mobile-bridge

setupTitle: 两种接入方式
setupSub: 用 Mac App 一站式开启，或者在命令行里按需安装。
setupAppTitle: 用 macOS App（推荐）
steps:
- title: 下载并打开
  body: 自动接入本机已在运行的 dsh；还没装的话，会征得你同意后装好 Node.js 与 @deepseek-ai/dsh。
- title: 在设置里开启扩展
  body: 「浏览器」「电脑操作」分页一键安装插件，逐项检查连接与授权；侧栏「移动端访问」生成配对码。
- title: 装好另一半
  body: 从 Chrome 应用商店添加扩展；从 Kimi 官方渠道安装 KimiCU.app；用 Android App 扫码。
setupCliTitle: 只用命令行
setupCliBody: 浏览器控制与手机远程是普通的 dsh 插件，macOS、Linux、Windows 上的 dsh 都能装；电脑操作需要 macOS。
setupCli: |-
  # 浏览器控制（再从 Chrome 应用商店安装扩展）
  dsh plugin --profile web add dsh-chrome-control

  # 电脑操作（需先安装 KimiCU.app，仅 macOS）
  dsh plugin --profile web add dsh-kimi-computer-use

  # 手机远程（装好后打开 dsh web 的 /mobileaccess 扫码）
  dsh plugin --profile web add dsh-mobile-bridge
stepsLink: 查看完整安装说明
stepsHref: docs/

trustTitle: 能做的更多，边界也更清楚
trustSub: 扩展让 Agent 碰到了浏览器、桌面和手机，所以每一处都设了边界。
trust:
- icon: chrome
  title: Cookie 不离开浏览器
  body: 浏览器控制复用登录态，但不上传 Cookie；只有扩展本身能连接控制通道，普通网页即使发现地址也接不进来。
- icon: lock
  title: 中转看不到内容
  body: 手机与电脑之间端到端加密，电脑不开端口；中转只搬运密文、不落盘，也可以换成你自己部署的。
- icon: smartphone
  title: 手机只做该做的事
  body: 手机只能访问白名单里的接口，配对和吊销只能在电脑上操作；吊销后已有连接立即断开。
- icon: shield
  title: 危险动作先确认
  body: 电脑操作内置的操作技能遇到发送、删除、购买、发布，会先说明再执行；远程访问做过一次公开的对抗性安全评审。
trustLink: 查看开源仓库与安全评审
trustHref: opensource/

faqTitle: 常见问题
faq:
- q: 需要先安装 DSH 吗？
  a: 用 Mac App 的话不需要：它会接入你已经装好的 dsh；还没装，就在征得你同意后装好 Node.js 与 @deepseek-ai/dsh。只用命令行的话，需要先有 dsh。
- q: 会和我正在跑的 dsh web 冲突吗？
  a: 不会。Mac App 启动时先探测 3080 端口，已有 dsh 服务就直接接入，不会再起一个；会话、模型配置、插件都是同一份，⇧⌘, 还能直接打开 Web 端。
- q: 不用 Mac App，能用这些扩展吗？
  a: 可以。浏览器控制和手机远程都是普通的 dsh 插件，在 macOS、Linux、Windows 上的 dsh 都能装；手机配对在 dsh web 的 /mobileaccess 页面完成。电脑操作需要 macOS。
- q: 浏览器控制会影响我正在用的 Chrome 吗？
  a: Cookie 不会被上传；Agent 优先复用你已打开的页面，真实输入在后台标签页执行，任务结束也不会关掉你自己的标签页。不想让它碰浏览器时，停用扩展即可。
- q: 电脑操作需要准备什么？
  a: 一台 macOS 电脑，从 Kimi 官方渠道安装 KimiCU.app 并保持运行，在系统设置里给 KimiCU.app 授予「辅助功能」与「屏幕录制」。真正执行动作的是 KimiCU，插件只负责把它接入 DSH。
- q: 手机远程需要公网 IP 吗？中转能看到我的数据吗？
  a: 不需要公网 IP，也不用开端口：电脑主动连到中转。手机与电脑之间是端到端加密，中转只读连接开头的路由信息，之后只转发密文，不落盘、不记日志。
- q: 这些扩展收费吗？
  a: 不收费。插件与中转以 MIT 许可开源；模型调用的费用照旧取决于你在 DSH 里配置的模型服务商。
faqMore: 更多问题
faqHref: docs/faq/

moreTitle: 更多 DSH 插件
more:
- icon: sparkles
  title: dsh-claude-subscription
  body: 在 DSH 里直接用你的 Claude Code 订阅跑 Claude 模型，不用另买 API Key，也不按 token 计费。仅 macOS。
  install: dsh plugin --profile web add @dshapp/dsh-claude-subscription
  href: https://github.com/dshapp/dsh-claude-subscription

