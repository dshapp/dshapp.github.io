painsBefore: 以前
painsAfter: 现在
pains:
- icon: apple
  tag: macOS App
  href: products/macos/
  before: 用 DSH 得守着终端里的 dsh web 和一个浏览器标签页：没有菜单栏和快捷键，任务跑完不会通知你；服务挂了、插件要装，都得回命令行。
  after: 一个为 Mac 打造的原生 App：菜单栏、快捷键、系统通知、Quick Look 一应俱全，同时接管本机的 dsh 服务，扩展一键开启。
- icon: globe
  tag: 浏览器控制
  href: products/chrome/
