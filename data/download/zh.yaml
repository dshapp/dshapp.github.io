installTitle: 安装步骤
platforms:
  - key: mac
    icon: apple
    name: macOS App
    button: 下载 .dmg
    requirements: macOS 15 或更高 · Apple Silicon（M1 及以上），暂不支持 Intel Mac
    docs: docs/install-macos/
    steps:
      - 打开下载的 .dmg，把 App 拖进「应用程序」文件夹。
      - 首次打开时 macOS 可能提示「无法验证开发者」—— 这是因为当前版本还没有经过 Apple 公证。在 Finder 里按住 Control 点按 App，选「打开」即可，之后不会再提示。
      - 启动后自动接入本机已在运行的 dsh；还没装 dsh 的话，会征得你同意后装好 Node.js 与 @deepseek-ai/dsh。
      - 有新版本时 App 内会提示更新，会话与设置都会保留。
  - key: android
    icon: android
    name: Android App
    button: 下载 .apk
    requirements: Android 8.0 或更高
    docs: docs/install-android/
    steps:
      - 用手机浏览器打开本页并下载 .apk（或在电脑下载后传到手机）。
      - 首次安装时按提示允许浏览器或文件管理器「安装未知应用」。
      - 电脑上需要安装 dsh-mobile-bridge 插件：在 Mac App 侧栏点「移动端访问」，或打开 dsh web 的 /mobileaccess 页面，用手机扫码即可连上。
  - key: chrome
    icon: chrome
    name: Chrome 扩展
    button: 前往 Chrome 应用商店
    requirements: Chrome 120 或更高 · 浏览器控制需配合 dsh-chrome-control 插件
    docs: docs/install-chrome/
    steps:
      - 安装 dsh-chrome-control 插件：在 Mac App 的「设置 → 浏览器」一键安装，或运行 dsh plugin --profile web add dsh-chrome-control。
      - 在 Chrome 应用商店点「添加至 Chrome」。
      - 设置页显示「已连接」即可使用；也可以固定扩展图标，在侧边栏里直接对话。
