installTitle: Install
platforms:
  - key: mac
    icon: apple
    name: macOS App
    button: Download .dmg
    requirements: macOS 15 or later · Apple Silicon (M1 and newer); Intel Macs aren’t supported yet
    docs: docs/install-macos/
    steps:
      - Open the downloaded .dmg and drag the app into Applications.
      - The first time, macOS may say it can’t verify the developer — this release isn’t notarized by Apple yet. Control-click the app in Finder and choose Open; you only need to do this once.
      - On launch it attaches to the dsh already running on your Mac; if dsh isn’t installed, it installs Node.js and @deepseek-ai/dsh after asking you.
      - The app lets you know when an update is available; sessions and settings are kept.
  - key: android
    icon: android
    name: Android App
    button: Download .apk
    requirements: Android 8.0 or later
    docs: docs/install-android/
    steps:
      - Open this page in your phone’s browser and download the .apk (or copy it over from your computer).
      - When prompted, allow your browser or file manager to install unknown apps.
      - Your computer needs the dsh-mobile-bridge plugin: click Mobile access in the Mac app sidebar, or open /mobileaccess in dsh web, and scan the QR code with your phone.
  - key: miniapp
    icon: wechat
    name: WeChat Mini Program
    requirements: WeChat on iPhone or Android
    qr: /img/dsh-remote-qr.jpg
    qrAlt: DSH Remote mini program code
    qrCaption: Scan with WeChat, or search for “DSH Remote” in WeChat
    docs: docs/install-miniapp/
    steps:
      - Scan the mini program code above with WeChat, or search for “DSH Remote” in WeChat — nothing to install.
      - Your computer needs the dsh-mobile-bridge plugin: click Mobile access in the Mac app sidebar, or open /mobileaccess in dsh web.
      - In the mini program, tap Scan QR Code to scan the pairing code (not WeChat’s own Scan), confirm the computer name and connect.
  - key: chrome
    icon: chrome
    name: Chrome extension
    button: Open Chrome Web Store
    requirements: Chrome 120 or later · browser control needs the dsh-chrome-control plugin
    docs: docs/install-chrome/
    steps:
      - Install the dsh-chrome-control plugin: one click in Settings → Browser in the Mac app, or run dsh plugin --profile web add dsh-chrome-control.
      - Click “Add to Chrome” in the Chrome Web Store.
      - Once Settings shows “Connected” you’re ready; pin the extension to chat from Chrome’s side panel too.
